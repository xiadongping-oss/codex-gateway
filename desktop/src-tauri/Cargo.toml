[package]
name = "codex-gateway-desktop"
version = "1.14.15"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
dunce = "1"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Unify the updater transport feature so Windows system proxy settings apply.
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "=2.1.1"
