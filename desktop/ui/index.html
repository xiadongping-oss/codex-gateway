<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Gateway</title><link rel="stylesheet" href="style.css"></head>
<body><div class="layout"><aside><div class="brand"><span class="mark">C</span><strong>Codex Gateway</strong></div><div class="nav active"><span>◉</span> 网关</div><div class="aside-bottom"><span class="dot"></span> 本机管理</div></aside><main><header><span class="eyebrow">工作空间</span><span class="version">桌面预览版</span></header><section class="intro"><h1>连接你的 AI 工作流</h1><p>管理本机网关，让应用与创作工具保持连接。</p></section><section class="card"><div class="card-top"><span class="gateway-icon">↗</span><span id="badge" class="badge">正在准备</span></div><h2 id="title">正在启动网关</h2><p id="message" aria-live="polite">正在准备本机服务，请稍候。</p><div class="details"><div><span>服务地址</span><strong id="address">等待连接</strong></div><div><span>当前任务</span><strong id="tasks">—</strong></div></div><div class="actions"><button id="reopen" hidden>打开控制台</button><button id="retry" hidden>重新启动</button><button id="continue" hidden>继续等待</button><button id="force" class="secondary" hidden>结束任务并退出</button><button id="restart" hidden>结束并重启</button><button id="logs" class="secondary">打开诊断日志</button><button id="quit" class="secondary">退出应用</button></div></section><p class="footnote">关闭窗口后仍在托盘运行 · 从托盘菜单可恢复窗口、设置自启动或退出</p><p id="desktop-notice" role="status"></p><p id="action-error" role="alert"></p></main></div><script src="app.js"></script></body></html>
