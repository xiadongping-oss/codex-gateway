<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整理图片素材</title><link rel="stylesheet" href="/asset-library.css"><script src="/asset-library.js" defer></script></head><body>
<header><div><h1>整理图片素材</h1><p>集合 · 标签 · 回收站 · 版本对比</p></div><button id="back">返回素材库</button></header>
<div class="layout"><aside><button id="libraryTab" aria-pressed="true">全部素材</button><button id="trashTab" aria-pressed="false">回收站</button><label>素材源<select id="source"><option value="">全部来源</option></select></label><label>集合<select id="collection"><option value="">全部集合</option></select></label><label>标签<select id="tag"><option value="">全部标签</option></select></label><p>集合与标签可通过批量整理创建，一张图可以归入多个集合。</p></aside>
<main><div class="tools"><input id="q" type="search" placeholder="搜索名称、标签、集合、备注或提示词" aria-label="搜索素材"><button id="favorite" aria-pressed="false">☆ 只看收藏</button><select id="sort" aria-label="排序"><option value="newest">最新优先</option><option value="name">名称排序</option></select><label>卡片大小<input id="size" type="range" min="160" max="360" step="20" value="220" aria-label="卡片大小"></label><button id="refresh">刷新</button></div>
<div class="batch" aria-label="批量操作"><span id="selection">未选择</span><button id="selectPage">本页全选</button><button id="clearSelection">取消选择</button><button id="organize">批量整理</button><button id="compare" disabled>对比两张</button><button id="trash" class="danger">移入回收站</button><button id="restore" hidden>恢复所选</button><button id="purge" class="danger" hidden>彻底删除</button></div>
<div id="message" role="status"></div><div id="error" role="alert" hidden></div><p id="count"></p><div id="grid"></div><p id="empty" hidden>没有匹配的素材，试试调整筛选条件。</p><nav id="pager" hidden aria-label="分页"><button id="prev">上一页</button><span id="pageInfo"></span><label>跳至<input id="page" type="number" min="1" value="1" aria-label="跳转页码"></label><button id="go">跳转</button><button id="next">下一页</button></nav></main></div>
<dialog id="organizer"><form id="organizerForm"><h2 id="organizerTitle">整理素材</h2><p>输入名称可创建新标签或集合，多个名称用逗号分隔。未填写的项目保持原样。</p><label>添加标签<input id="addTags" placeholder="例如：插画, 待修改" maxlength="1400" list="tagSuggestions"></label><label>移除标签<input id="removeTags" list="tagSuggestions" maxlength="1400"></label><datalist id="tagSuggestions"></datalist><label>加入集合<input id="addCollections" placeholder="例如：官网改版, 首页横幅" list="collectionSuggestions" maxlength="1800"></label><label>移出集合<input id="removeCollections" list="collectionSuggestions" maxlength="1800"></label><datalist id="collectionSuggestions"></datalist><label>收藏状态<select id="favoriteChange"><option value="">保持原样</option><option value="true">收藏</option><option value="false">取消收藏</option></select></label><label id="notesField">图片备注<textarea id="notes" maxlength="8000" placeholder="记录用途、修改要求或交付说明"></textarea></label><div class="dialog-actions"><button type="button" id="cancelOrganize">取消</button><button class="primary" id="saveOrganize">保存整理</button></div></form></dialog>
<dialog id="comparison"><div class="compare-head"><h2>图片对比</h2><button id="sideMode" aria-pressed="true">并排</button><button id="wipeMode" aria-pressed="false">滑动叠加</button><button id="swap">交换左右</button><button id="closeCompare">关闭</button></div><p id="compareHint">按完整图片显示，未裁切原图。不同尺寸的图片会按相同比例容器适配，叠加视图不代表像素级差异。</p><div id="sideStage"><figure><img id="leftImage" alt="左侧图片"><figcaption id="leftCaption"></figcaption></figure><figure><img id="rightImage" alt="右侧图片"><figcaption id="rightCaption"></figcaption></figure></div><div id="wipeStage" hidden><img id="wipeLeft" alt="左侧底图"><div id="wipeOverlay"><img id="wipeRight" alt="右侧对比图"></div></div><label id="wipeControl" hidden>对比位置<input id="wipePosition" type="range" min="0" max="100" value="50" aria-label="对比位置"></label><div id="pairPicker" hidden><label>选择同系列版本<select id="versionChoice"></select></label><button id="compareVersion">与此版本对比</button></div></dialog>
</body></html>
