name: Main CI

# main 与 PR 的快速守护：密钥扫描、gateway 单元/构建测试、桌面 UI 契约、
# dist 入库一致性、桌面 Rust 编译。桌面原生窗口场景与 macOS 双架构
# 验证仍由 desktop-macos.yml 与本地 desktop:verify 负责，本工作流不重复。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    name: gateway, frontend and desktop checks (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      # Windows runner 默认 core.autocrlf=true 会把 LF 文件 CRLF 化，
      # 干扰 dist 漂移比对与 EOL 相关测试；统一禁用，只由 .gitattributes 决定。
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Restore Rust build cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            desktop/src-tauri/target/debug/.fingerprint
            desktop/src-tauri/target/debug/build
            desktop/src-tauri/target/debug/deps
          key: windows-x64-rust-1.94-v1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-x64-rust-1.94-v1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Install gateway dependencies
        run: npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
      - name: Prepare vendored bridge
        run: npm run prepare:bridge
      - name: Secret scan
        run: npm run scan:secrets
      - name: Gateway unit tests
        run: npm run test:unit
      - name: Build release tests
        run: npm run test:build
      - name: Desktop UI contract tests
        run: npm run test:desktop:ui
      - name: Frontend build and dist drift check
        run: npm run check:dist-drift
      - name: Desktop Rust build
        run: npm run desktop:build
      - name: Preserve reusable Rust build work
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' && hashFiles('desktop/src-tauri/target/.rustc_info.json') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            desktop/src-tauri/target/debug/.fingerprint
            desktop/src-tauri/target/debug/build
            desktop/src-tauri/target/debug/deps
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
